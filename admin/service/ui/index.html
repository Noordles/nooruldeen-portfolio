<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#11110f"><title>Noor / Owner Studio</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" type="module"></script></head>
<body><header class="studio-top"><a class="studio-brand" href="/admin">NOOR <span>/ OWNER STUDIO</span></a><span id="save-state" role="status">Connecting securely…</span><div class="actions"><button id="save" disabled>Save draft</button><button id="preview" disabled>Preview</button><button id="publish" class="primary" disabled>Publish</button></div></header>
<div class="studio-shell"><aside><label class="mobile-label" for="mobile-nav">Go to</label><select id="mobile-nav"></select><nav id="navigation" aria-label="Admin sections"></nav><a class="logout" href="/cdn-cgi/access/logout">Sign out ↗</a></aside><main id="workspace" aria-live="polite"><p>Verifying your owner session…</p></main></div>
<div id="notice" role="status" class="notice" hidden></div>
<dialog id="preview-dialog"><header><h2>Private preview</h2><button id="close-preview" aria-label="Close preview">Close ×</button></header><p>Unsaved content is shown only in this preview.</p><iframe id="preview-frame" title="Website content preview" referrerpolicy="same-origin"></iframe></dialog>
<dialog id="media-dialog"><header><h2>Choose media</h2><button id="close-media">Close ×</button></header><input id="media-search" type="search" placeholder="Search images and audio" aria-label="Search media"><div id="media-choices" class="media-grid"></div></dialog>
</body></html>
